name: Discord Notify

on:
  push:
    tags:
      - 'v*'   # fires on version tags like v1.0.0

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "🚀 New release **${{ github.ref_name }}** pushed by ${{ github.actor }}: ${{ github.event.head_commit.message }}"}' \
          ${{ secrets.DISCORD_WEBHOOK }}
