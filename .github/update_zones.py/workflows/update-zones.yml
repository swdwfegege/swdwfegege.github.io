from pathlib import Path
import re

FRONTEND = Path("frontend.html")
ZONES_DIR = Path("zones")

frontend = FRONTEND.read_text(encoding="utf-8")

# Find the ZONES array
match = re.search(
    r"(const\s+ZONES\s*=\s*\[)(.*?)(\];)",
    frontend,
    re.DOTALL
)

if not match:
    raise RuntimeError("Could not find const ZONES = [...] in frontend.html")

start = match.group(1)
existing = match.group(2)
end = match.group(3)

# --------------------------------------------------
# Find every HTML file inside zones/
# --------------------------------------------------

zone_files = sorted(
    p for p in ZONES_DIR.iterdir()
    if p.is_file() and p.suffix.lower() == ".html"
)

# Normalize paths to the same format used by frontend.html
zone_paths = {
    p.as_posix().replace("\\", "/")
    for p in zone_files
}

# --------------------------------------------------
# Remove every existing automatically-managed entry
# whose link points to a file in zones/
#
# This prevents duplicates.
# --------------------------------------------------

entry_pattern = re.compile(
    r"\s*\{\s*"
    r"name:\s*(['\"])(.*?)\1\s*,\s*"
    r"image:\s*(['\"])(.*?)\3\s*,\s*"
    r"link:\s*(['\"])(.*?)\5\s*"
    r"\}\s*,?",
    re.DOTALL
)

entries = []

for m in entry_pattern.finditer(existing):
    name = m.group(2)
    image = m.group(4)
    link = m.group(6).replace("\\", "/")

    # Keep entries that aren't pointing to zones/
    if not link.startswith("zones/"):
        entries.append({
            "name": name,
            "image": image,
            "link": link
        })

# --------------------------------------------------
# Add every HTML file currently in zones/
# --------------------------------------------------

for path in zone_files:
    relative = path.as_posix()

    # Remove "zones/" to make the display name
    filename = path.stem

    # Turn underscores/dashes into spaces
    name = filename.replace("_", " ").replace("-", " ").strip()

    entries.append({
        "name": name,
        "image": "",
        "link": relative
    })

# --------------------------------------------------
# Remove duplicates by link
# The first occurrence wins.
# --------------------------------------------------

unique = []
seen_links = set()

for entry in entries:
    link = entry["link"]

    if link in seen_links:
        continue

    seen_links.add(link)
    unique.append(entry)

# Sort alphabetically
unique.sort(key=lambda x: x["name"].lower())

# --------------------------------------------------
# Rebuild ZONES
# --------------------------------------------------

new_zones = "\n"

for entry in unique:
    name = entry["name"].replace("\\", "\\\\").replace("'", "\\'")
    image = entry["image"].replace("\\", "\\\\").replace("'", "\\'")
    link = entry["link"].replace("\\", "\\\\").replace("'", "\\'")

    new_zones += (
        f"  {{ name: '{name}', image: '{image}', link: '{link}' }},\n"
    )

new_frontend = (
    frontend[:match.start()]
    + start
    + new_zones
    + end
    + frontend[match.end():]
)

FRONTEND.write_text(new_frontend, encoding="utf-8")

print(f"Updated frontend.html with {len(unique)} zones.")
