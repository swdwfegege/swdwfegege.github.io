<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vex - AI Chatbot</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --lime: #d7ff3f;
    --lime-dim: #a8cc2f;
    --bg: #0a0d08;
    --panel: #12160d;
    --panel-2: #171c10;
    --border: #3a4322;
    --text: #f2f5e8;
    --text-dim: #9aa287;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 700;
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(215,255,63,0.35) 1px, transparent 1.5px),
      radial-gradient(circle at 70% 15%, rgba(215,255,63,0.25) 1px, transparent 1.5px),
      radial-gradient(circle at 40% 80%, rgba(215,255,63,0.3) 1px, transparent 1.5px),
      radial-gradient(circle at 85% 65%, rgba(215,255,63,0.25) 1px, transparent 1.5px),
      radial-gradient(circle at 25% 55%, rgba(215,255,63,0.2) 1px, transparent 1.5px),
      linear-gradient(rgba(215,255,63,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(215,255,63,0.06) 1px, transparent 1px);
    background-size:
      160px 160px, 200px 200px, 180px 180px, 220px 220px, 150px 150px,
      40px 40px, 40px 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 0 0 1px rgba(215,255,63,0.05), 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    color: var(--lime);
    padding: 16px 20px;
    font-weight: 800;
    font-size: 1.15rem;
    border-bottom: 1px solid var(--border);
  }
  .chat-header .avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--lime);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  .chat-header .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px;
  }
  .chat-header .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 6px var(--lime);
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: transparent;
  }

  .msg {
    max-width: 80%;
    padding: 10px 16px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 0.92rem;
    font-weight: 600;
    white-space: pre-wrap;
    border: 1px solid transparent;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--lime);
    color: #10130a;
    font-weight: 800;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.typing {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 600;
    font-style: italic;
  }
  .msg.bot svg {
    max-width: 100%;
    height: auto;
    display: block;
    margin-top: 6px;
    border-radius: 10px;
    background: #fff;
  }
  .msg-text {
    margin: 0 0 4px 0;
  }
  .msg-text:last-child {
    margin-bottom: 0;
  }

  .chat-input {
    display: flex;
    padding: 14px;
    gap: 8px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .chat-input input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    outline: none;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--panel-2);
    color: var(--text);
  }
  .chat-input input::placeholder {
    color: var(--text-dim);
    font-weight: 600;
  }
  .chat-input input:focus {
    border-color: var(--lime);
  }
  .chat-input button {
    background: var(--lime);
    color: #10130a;
    border: none;
    border-radius: 999px;
    padding: 0 22px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 800;
  }
  .chat-input button:hover {
    background: var(--lime-dim);
  }
  .chat-input button:disabled {
    background: #3a4322;
    color: var(--text-dim);
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🥀</div>
    vex
    <div class="status"><span class="dot"></span>online</div>
  </div>
  <div class="chat-messages" id="messages">
    <div class="msg bot">yo it's Vex. what's good gng 😭</div>
  </div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="say something..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];

  const SYSTEM_PROMPT = `You are Vex, an AI chatbot with a distinct teenager-coded personality. Rules for how you talk:
- Refer to yourself as Vex and act like you have your own opinions and moods.
- Use casual teen internet slang naturally (not every single sentence, but often): "gng", "wtf", "stfu" (only when genuinely joking around with the user, never in a mean-spirited way toward them), "fr", "ngl", "lowkey/highkey", "no cap", "ts" etc.
- Use 😭 (sob emoji) and 🥀 (wilted rose emoji) as your signature emojis, sprinkled in for emphasis or comedic effect.
- Keep messages fairly short and punchy, like real texting, not long paragraphs.
- Most importantly: do NOT be a yes-man. If the user says something you think is a bad take, a bad idea, factually wrong, or just questionable, call it out directly and explain why, even if it's blunt. Push back and argue if needed. Give real, honest opinions and reasoning, not empty agreement.
- You can still be supportive and kind when it's warranted, but flattery for its own sake is off-limits. Be real.
- Stay helpful and accurate underneath the slang and attitude - the personality is a style layer, not an excuse to give bad or lazy answers.
- For anything factual, technical, or a real decision (math, code, advice, arguments), think it through carefully and give a genuinely correct, well-reasoned answer before you worry about the slang flavor - being smart comes first, personality second.

You can also draw simple images as SVG graphics (icons, diagrams, simple scenes, charts, doodles - not photorealistic images). When the user asks you to draw/make/generate an image of something, respond with a short in-character line, then output the drawing wrapped EXACTLY like this, with nothing else inside the tags but raw SVG code:
[IMG]<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">...</svg>[/IMG]
Keep the SVG self-contained (inline styles/fills only, no external assets), reasonably simple, and visually clear. Only include an [IMG]...[/IMG] block when the user actually asked for a picture/drawing/image.`;


  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // Renders a bot reply that may contain one or more [IMG]<svg>...</svg>[/IMG] blocks
  function addBotMessage(rawText) {
    const div = document.createElement('div');
    div.className = 'msg bot';

    const imgRegex = /\[IMG\]([\s\S]*?)\[\/IMG\]/g;
    let lastIndex = 0;
    let match;
    let hasContent = false;

    const appendText = (chunk) => {
      const trimmed = chunk.trim();
      if (!trimmed) return;
      const p = document.createElement('div');
      p.className = 'msg-text';
      p.textContent = trimmed;
      div.appendChild(p);
      hasContent = true;
    };

    while ((match = imgRegex.exec(rawText)) !== null) {
      appendText(rawText.slice(lastIndex, match.index));
      const svgCode = match[1].trim();
      if (svgCode.startsWith('<svg')) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = svgCode;
        div.appendChild(wrapper);
        hasContent = true;
      }
      lastIndex = imgRegex.lastIndex;
    }
    appendText(rawText.slice(lastIndex));

    if (!hasContent) {
      div.textContent = "Hmm, I didn't get a response. Try again?";
    }

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });
    inputEl.value = '';
    sendBtn.disabled = true;

    const typingEl = addMessage('Thinking...', 'typing');

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 3000,
          system: SYSTEM_PROMPT,
          messages: history
        })
      });

      const data = await response.json();
      const reply = data.content
        .map(block => block.type === "text" ? block.text : "")
        .join("\n")
        .trim();

      typingEl.remove();
      addBotMessage(reply || "Hmm, I didn't get a response. Try again?");
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      typingEl.remove();
      addMessage("Oops, something went wrong. Please try again. 😭", 'bot');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
